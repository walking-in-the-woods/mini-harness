name: ci

on:
  push:
    branches: [main, "release-*"]
  pull_request:

permissions:
  contents: read

jobs:

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bash syntax check
        run: |
          shopt -s nullglob
          for f in deploy.sh run.sh; do
            [[ -f "$f" ]] || continue
            bash -n "$f"
          done

      - name: Python syntax check
        run: python -m py_compile harness/*.py harness/backends/*.py

      - name: Import check
        # Пустой .env — импорт не должен требовать модели или живого
        # сервера на уровне модуля. Список модулей включает оба
        # бэкенда: OllamaBackend без сервера не падает (только
        # создаёт клиента), LlamaCppBackend вообще не ходит в сеть
        # при конструировании.
        run: |
          touch .env
          python -c "import harness.agent; import harness.fs_guard; \
                     import harness.injection_guard; import harness.confirm; \
                     import harness.audit; import harness.proxy; \
                     import harness.backends; \
                     import harness.backends.base; \
                     import harness.backends.ollama_backend; \
                     import harness.backends.llamacpp_backend"

  tests:
    needs: static-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/ --ignore=tests/smoke -v
