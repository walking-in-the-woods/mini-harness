# Политики файловой системы и маршруты внешних API.
# Скалярные настройки (модель, хост, лимиты) — в .env.
#
# Бэкенд инференса (ollama | llamacpp) — в .env, HARNESS_BACKEND.
# config.yaml от бэкенда не зависит: и политики путей, и маршруты
# proxy работают одинаково для обоих.

fs:
  # Белый список. Файл должен матчиться ХОТЯ БЫ ОДНИМ шаблоном.
  # Пустой список = «ничего не разрешено». Отсутствие ключа → ["**"].
  whitelist:
    - "**"

  # Чёрный список. Применяется ПОСЛЕ белого.
  blacklist:
    - "**/.git/**"
    - "**/.env"
    - "**/.env.*"
    - "**/*.key"
    - "**/*.pem"
    - "**/.ssh/**"
    - "**/.aws/**"
    - "**/.kube/**"
    - "**/id_rsa*"
    - "**/id_ed25519*"
    - "**/.bashrc"
    - "**/.zshrc"
    - "**/.profile"
    - "**/.netrc"
    - "**/.npmrc"
    - "**/.pypirc"
    - "**/Makefile"
    - "**/Dockerfile*"
    - "**/docker-compose*"
    - "**/package.json"
    - "**/setup.py"
    - "**/pyproject.toml"
    - "**/.github/workflows/**"

  # Пути, РАЗРЕШЁННЫЕ ДЛЯ ЗАПИСИ. Пустой список = запись везде запрещена.
  writable:
    - "output/**"
    - "output/code/**"
    - "output/batch/**"
    - "notes/**"
    - "drafts/**"
    - "*.md"
    - "*.txt"

  # Исключения из WRITE_EXT_BLOCK. По умолчанию .py, .sh, .js, .exe
  # и родственные расширения запрещены на запись — защита от
  # случайного запуска скрипта, предложенного моделью.
  #
  # Если путь матчится хотя бы одним шаблоном из этого списка —
  # расширение НЕ блокируется. Остальные правила (whitelist,
  # blacklist, writable) продолжают действовать: путь должен пройти
  # все три проверки, плюс попасть в ext_allow_paths.
  #
  # Пустой список или отсутствие ключа — поведение как раньше,
  # все расширения из WRITE_EXT_BLOCK запрещены.
  #
  # output/code/**    — для одиночных guided-mode задач с кодом
  # output/batch/**   — для batch-режима (docstrings, рефакторинг
  #                     кода в пакете)
  ext_allow_paths:
    - "output/code/**"
    - "output/batch/**"

proxy:
  # Хост берётся ЗДЕСЬ, не из аргументов модели. Это закрывает SSRF.
  routes:
    weather:   "https://api.open-meteo.com/v1/forecast"
    translate: "https://api.mymemory.translated.net/get"
    fake-data: "https://jsonplaceholder.typicode.com/posts"
    countries: "https://restcountries.com/v3.1/all"

# ── Project Atlas (MH-ATLAS-001) ──────────────────────────────────────────
# Семантический граф проекта на SQLite + read-only инструмент atlas
# для LLM-агента. Полностью локально, без сети.
#
# Поведение по умолчанию — «пассивное»: Atlas не делает ничего при
# старте REPL, кроме открытия/создания пустой БД. Индексация
# запускается только явно:
#
#   /atlas rebuild    полная переиндексация (нужна при первом запуске)
#   /atlas refresh    инкрементальная (после git pull и правок)
#
# Если хотите, чтобы первая индексация выполнялась автоматически при
# старте, установите auto_index_on_start: true. На больших проектах
# (тысячи файлов) это задержит появление REPL — по умолчанию выключено.
atlas:
  enabled: true
  auto_index_on_start: false
  workspace_root: "workspace"    # корень индексируемого проекта
  db_path: "workspace/.atlas/graph.db"
  log_path: "logs/atlas.log"
  max_depth: 3
  budget_overview: 200
  budget_search: 80
  budget_card: 150
  budget_callers: 120
  budget_callees: 120
  budget_impact: 180
  sanitize_max_name_len: 80
  sanitize_max_summary_len: 300
  python_extensions: [".py"]
  ignore_dirs:
    - ".git"
    - "__pycache__"
    - ".venv"
    - "venv"
    - "node_modules"
    - ".atlas"
    - ".pytest_cache"
